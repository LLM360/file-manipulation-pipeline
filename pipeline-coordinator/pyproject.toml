[project]
name = "pipeline-coordinator"
version = "0.1.0"
description = "FastAPI-based coordinator for distributed office-files pipeline workers"
requires-python = ">=3.11"
dependencies = [
    "polars",
    "pydantic-settings[toml]",
    "fastapi",
    "uvicorn[standard]",
    "httpx",
]

[project.scripts]
pipeline-coordinator = "pipeline_coordinator.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pipeline_coordinator"]
